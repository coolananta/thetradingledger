{{ if .Site.Params.analytics.enabled }}
<!-- Optimized Google Tag (gtag.js) -->
<script>
  window.addEventListener('DOMContentLoaded', function() {
    var loadGtag = function() {
      if (window.gtagLoaded) return;
      window.gtagLoaded = true;

      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.analytics.gtagId }}';
      document.head.appendChild(script);

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ .Site.Params.analytics.gtagId }}');
    };

    // Load after user interaction OR when browser is idle
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadGtag);
    } else {
      setTimeout(loadGtag, 1500);
    }
  });
</script>
{{ end }}
